[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    device: requires connected iPhone, configured signing and running Appium
    restart_app: test owns app startup; disable the session's automatic app launch
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %H:%M:%S
